<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JFESPRO</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ---------- THEME (Style #12: Vibrant High Contrast) ---------- */
    :root {
      --bg: #0b0e14;
      --surface: #151a22;
      --card: #1e2530;
      --border: #2e3a48;
      --text: #f0f4fa;
      --text-secondary: #b0c0d0;
      --primary: #ff3d6e;
      --primary-glow: #ff6b8f;
      --accent: #00e5ff;
      --accent-alt: #ffd000;
      --up: #ff4d6d;
      --down: #00b4d8;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 61, 110, 0.15);
      --shadow-glow: 0 0 24px rgba(255, 61, 110, 0.35);
      --spacing: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --tab-height: 64px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #app {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
    }

    /* ---------- SCROLL CONTAINER ---------- */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      background: var(--bg);
      padding-top: var(--safe-top);
    }

    .page-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 8px);
    }

    .page-scroll.no-tab {
      padding-bottom: 16px;
    }

    /* ---------- TYPOGRAPHY ---------- */
    h1, h2, h3, h4 {
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    /* ---------- TRANSITIONS ---------- */
    .fade-slide-enter-active,
    .fade-slide-leave-active {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fade-slide-enter-from {
      opacity: 0;
      transform: translateY(12px) scale(0.98);
    }

    .fade-slide-leave-to {
      opacity: 0;
      transform: translateY(-12px) scale(0.98);
    }

    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.3s ease;
    }

    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }

    /* ---------- TAB BAR ---------- */
    .tab-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: var(--tab-height);
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      min-height: 44px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      gap: 2px;
      text-decoration: none;
      position: relative;
    }

    .tab-item.router-link-active {
      color: var(--primary);
    }

    .tab-item.router-link-active .tab-icon {
      filter: drop-shadow(0 0 6px var(--primary-glow));
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- LOADING PAGE ---------- */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--bg);
      gap: 24px;
      padding: 24px;
    }

    .loading-logo {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 60px rgba(255, 61, 110, 0.5);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- HOME ---------- */
    .home-header {
      padding: 24px 20px 12px;
      background: linear-gradient(180deg, rgba(255, 61, 110, 0.08) 0%, transparent 100%);
    }

    .brand-name {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 2px;
      font-weight: 500;
    }

    .home-section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      padding: 0 20px;
      margin: 20px 0 10px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 16px;
    }

    .feature-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 6px;
      background: var(--card);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
      text-align: center;
    }

    .feature-card:active {
      transform: scale(0.95);
      background: var(--surface);
    }

    .feature-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .feature-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.2;
      word-break: break-word;
    }

    /* Stock list */
    .stock-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .stock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--card);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 44px;
      gap: 12px;
    }

    .stock-item:active {
      transform: scale(0.98);
      border-color: var(--primary);
      box-shadow: var(--shadow-glow);
    }

    .stock-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .stock-symbol {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
    }

    .stock-name {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stock-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .stock-price {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .stock-change {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stock-change.up {
      color: var(--up);
    }

    .stock-change.down {
      color: var(--down);
    }

    /* ---------- SUB PAGE HEADER ---------- */
    .sub-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
      background: var(--border);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sub-title {
      font-size: 18px;
      font-weight: 700;
      flex: 1;
    }

    /* ---------- DETAIL PAGE (chart) ---------- */
    .detail-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .detail-price-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-big-price {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .detail-change-big {
      font-size: 18px;
      font-weight: 600;
    }

    .chart-container {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px 8px 8px;
      overflow: hidden;
    }

    .chart-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ---------- TOOLBOX ---------- */
    .toolbox-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
    }

    .tool-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tool-card:active {
      transform: scale(0.98);
      border-color: var(--primary);
    }

    .tool-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 61, 110, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .tool-card-icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tool-card-title {
      font-weight: 700;
      font-size: 15px;
    }

    .tool-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ---------- SETTINGS ---------- */
    .settings-list {
      display: flex;
      flex-direction: column;
      padding: 8px 0;
    }

    .settings-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      cursor: pointer;
      transition: background 0.15s ease;
      min-height: 44px;
      border-bottom: 1px solid rgba(46, 58, 72, 0.5);
    }

    .settings-item:active {
      background: var(--card);
    }

    .settings-item-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .settings-item-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .settings-item-label {
      flex: 1;
      font-weight: 500;
      font-size: 15px;
    }

    .settings-item-arrow {
      color: var(--text-secondary);
      font-size: 18px;
      opacity: 0.6;
    }

    .settings-item-version {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* ---------- PRIVACY / TERMS / ABOUT ---------- */
    .legal-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .legal-content h2 {
      color: var(--text);
      font-size: 18px;
      margin-top: 8px;
    }

    .legal-content p {
      margin: 0;
    }

    /* ---------- CHECK-IN ---------- */
    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 20px;
    }

    .checkin-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      min-height: 36px;
    }

    .checkin-day.today {
      border-color: var(--accent);
      color: var(--accent);
    }

    .checkin-day.checked {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .checkin-day.empty {
      background: transparent;
      border-color: transparent;
      color: transparent;
    }

    /* ---------- FEEDBACK / FORMS ---------- */
    .form-group {
      padding: 0 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s ease;
      min-height: 44px;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(255, 61, 110, 0.2);
    }

    .form-textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
      font-family: var(--font);
      width: 100%;
    }

    .btn-primary:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ---------- TOAST ---------- */
    .toast-overlay {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 40px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      animation: toastIn 0.3s ease;
      white-space: nowrap;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ---------- MODAL ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }

    .modal-box {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      max-height: 70vh;
      overflow-y: auto;
    }

    .modal-box h3 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .modal-box p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* ---------- UTILS ---------- */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 20px;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 36px;
      display: flex;
      align-items: center;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ---------- SCROLLBAR ---------- */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ============================================================
    // HOW TO ADD A NEW PAGE:
    // 1. Add a new route object in `routes` array (path, component).
    // 2. Define the component with a unique name and template.
    // 3. If the page should appear as a tab, add a <router-link>
    //    in the tab bar section (Home / Toolbox / Settings).
    // ============================================================

    const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

    // ---------- STATIC DATA (built-in) ----------
    const STOCKS = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 187.45, change: 1.23 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 412.30, change: 0.85 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 156.78, change: -0.42 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.92, change: 2.15 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 892.50, change: 4.32 },
      { symbol: 'META', name: 'Meta Platforms', price: 502.18, change: -1.08 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 245.67, change: -3.21 },
      { symbol: 'BRK.B', name: 'Berkshire Hathaway', price: 402.15, change: 0.34 },
      { symbol: 'JPM', name: 'JPMorgan Chase', price: 198.45, change: 0.67 },
      { symbol: 'V', name: 'Visa Inc.', price: 278.90, change: -0.21 },
      { symbol: 'JNJ', name: 'Johnson & Johnson', price: 152.30, change: 0.45 },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 68.92, change: 1.12 },
      { symbol: 'PG', name: 'Procter & Gamble', price: 162.45, change: -0.33 },
      { symbol: 'MA', name: 'Mastercard Inc.', price: 456.78, change: 0.91 },
      { symbol: 'HD', name: 'Home Depot', price: 345.60, change: -0.78 },
      { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.34, change: 2.45 },
      { symbol: 'PYPL', name: 'PayPal Holdings', price: 62.78, change: -1.56 },
      { symbol: 'NFLX', name: 'Netflix Inc.', price: 628.90, change: 1.87 },
      { symbol: 'ADBE', name: 'Adobe Inc.', price: 478.23, change: -0.65 },
      { symbol: 'CRM', name: 'Salesforce Inc.', price: 298.45, change: 0.53 },
      { symbol: 'INTC', name: 'Intel Corp.', price: 31.20, change: -4.12 },
      { symbol: 'AMD', name: 'Advanced Micro Devices', price: 178.90, change: 3.45 }
    ];

    // Generate 30-day price history for a stock
    function generateHistory(symbol, basePrice) {
      const seed = symbol.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      const history = [];
      let price = basePrice * 0.92;
      for (let i = 0; i < 30; i++) {
        const pseudo = Math.sin(seed + i * 1.7) * 0.5 + 0.5;
        const change = (pseudo - 0.48) * basePrice * 0.035;
        price = Math.max(basePrice * 0.7, Math.min(basePrice * 1.25, price + change));
        history.push({
          day: i + 1,
          price: Math.round(price * 100) / 100
        });
      }
      // ensure last price matches current price
      history[history.length - 1].price = basePrice;
      return history;
    }

    // ---------- ROUTE COMPONENTS ----------

    // ---- Loading ----
    const LoadingPage = {
      name: 'LoadingPage',

        const stock = STOCKS.find(s => s.symbol === symbol) || STOCKS[0];

        const minPrice = Math.min(...history.map(h => h.price));
        const maxPrice = Math.max(...history.map(h => h.price));
        const padding = (maxPrice - minPrice) * 0.15 || 1;
        const yMin = minPrice - padding;
        const yMax = maxPrice + padding;
        const yRange = yMax - yMin;

        const chartW = 320;
        const chartH = 180;
        const chartPadX = 8;

          const y = chartPadY + innerH - ((h.price - yMin) / yRange) * innerH;

            </div>
          </div>
        </div>
      `,
      setup() {
        const amount = ref(100000);
        const rate = ref(5.5);
        const months = ref(360);
        const mode = ref('equalPI');

        const monthlyPayment = computed(() => {
          if (!amount.value || !rate.value || !months.value) return 0;
          const r = rate.value / 100 / 12;
          const n = months.value;
          if (mode.value === 'equalPI') {
            if (r === 0) return amount.value / n;
            return (amount.value * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
          } else {
            // equal principal: first month payment
            return amount.value / n + amount.value * r;
          }
        });

        const totalInterest = computed(() => {
          if (!amount.value || !rate.value || !months.value) return 0;
          const r = rate.value / 100 / 12;
          const n = months.value;
          if (mode.value === 'equalPI') {
            return monthlyPayment.value * n - amount.value;
          } else {
            // sum of interest decreasing linearly
            let totalInt = 0;
            for (let i = 0; i < n; i++) {
              totalInt += (amount.value - (amount.value / n) * i) * r;
            }
            return totalInt;
          }
        });

        return { amount, rate, months, mode, monthlyPayment, totalInterest };
      }
    };

              <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">MD5 digest</div>
              <div style="font-family:monospace;font-size:13px;word-break:break-all;color:var(--accent);margin-bottom:16px;">{{ md5Hash }}</div>
              <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">Strength</div>
              <div style="display:flex;gap:4px;margin-bottom:8px;">
                <div v-for="n in 5" :key="n" style="height:6px;flex:1;border-radius:3px;" :style="{background: n<=strengthScore ? strengthColor : 'var(--border)'}"></div>

          </div>
        </div>
      `,
      setup() {
        const password = ref('');
        const md5Hash = computed(() => password.value ? md5(password.value) : '');

        const strengthScore = computed(() => {
          const p = password.value;
          if (!p) return 0;
          let score = 0;
          if (p.length >= 8) score++;
          if (p.length >= 12) score++;
          if (/[A-Z]/.test(p) && /[a-z]/.test(p)) score++;
          if (/\d/.test(p)) score++;
          if (/[^A-Za-z0-9]/.test(p)) score++;
          return Math.min(score, 5);
        });

        const strengthColor = computed(() => {
          const s = strengthScore.value;
          if (s <= 1) return '#ff3d6e';
          if (s <= 2) return '#ff8c00';
          if (s <= 3) return '#ffd000';
          if (s <= 4) return '#00e5ff';
          return '#00e676';
        });

        const strengthLabel = computed(() => {
          const s = strengthScore.value;
          if (!password.value) return '';
          if (s <= 1) return 'Very weak';
          if (s <= 2) return 'Weak';
          if (s <= 3) return 'Fair';
          if (s <= 4) return 'Strong';
          return 'Very strong';
        });

        return { password, md5Hash, strengthScore, strengthColor, strengthLabel };
      }
    };

          checked.value.push(today);
          localStorage.setItem('checkin_' + year + '_' + month, JSON.stringify(checked.value));
